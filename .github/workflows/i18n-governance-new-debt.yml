name: i18n Governance — New Debt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'frontend/src/**'
      - 'frontend/scripts/i18n-*.mjs'
      - 'frontend/scripts/lib/i18n-governance/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/i18n-governance-new-debt.yml'

permissions:
  contents: read

jobs:
  i18n-new-debt-gate:
    name: i18n-new-debt-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scanner tests
        run: npm run i18n:scanner:test

      - name: Dictionary check
        run: npm run i18n:check

      - name: PR new-debt gate
        env:
          AUTHORITY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'i18n-governance-authority-change') }}
        run: |
          ARGS=(--base-sha "${{ github.event.pull_request.base.sha }}")
          if [ "$AUTHORITY_APPROVED" = "true" ]; then
            ARGS+=(--authority-approved)
          fi
          npm run i18n:pr-gate -- "${ARGS[@]}"
