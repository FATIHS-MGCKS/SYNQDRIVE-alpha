name: i18n Governance — New Debt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  i18n-new-debt-gate:
    name: i18n-new-debt-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify PR relevance (workflow-inline trusted bootstrap)
        id: relevance
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          DIFF_FILE="${RUNNER_TEMP}/i18n-governance-changed-paths-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"

          git diff --name-only -z \
            "${BASE_SHA}...${HEAD_SHA}" \
            > "${DIFF_FILE}"

          relevant=false
          while IFS= read -r -d '' path; do
            if [[ -z "$path" ]]; then
              continue
            fi
            case "$path" in
              frontend/src/*|frontend/scripts/i18n-*.mjs|frontend/scripts/lib/i18n-governance/*|frontend/package.json|frontend/package-lock.json|.github/workflows/i18n-governance-new-debt.yml)
                relevant=true
                break
                ;;
            esac
          done < "${DIFF_FILE}"

          echo "relevant=${relevant}" >> "$GITHUB_OUTPUT"
          echo "I18N_RELEVANT_CHANGES=$([[ "$relevant" == true ]] && echo YES || echo NO)"
          echo "BASE_SHA=${BASE_SHA}"
          echo "HEAD_SHA=${HEAD_SHA}"

      - name: Irrelevant PR no-op pass
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "I18N_PR_GATE=PASS"
          echo "I18N_PR_GATE_REASON=NO_I18N_RELEVANT_CHANGES"
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "I18N_RELEVANT_CHANGES=NO"

      - name: Setup Node.js
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: npm ci

      - name: Scanner tests
        if: steps.relevance.outputs.relevant == 'true'
        run: npm run i18n:scanner:test

      - name: PR-gate adversarial tests
        if: steps.relevance.outputs.relevant == 'true'
        run: npm run i18n:pr-gate:test

      - name: Dictionary check (read-only)
        if: steps.relevance.outputs.relevant == 'true'
        run: npm run i18n:check:ci

      - name: PR new-debt gate
        id: gate
        if: steps.relevance.outputs.relevant == 'true'
        env:
          AUTHORITY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'i18n-governance-authority-change') }}
        run: |
          ARGS=(--base-sha "${{ github.event.pull_request.base.sha }}")
          if [ "$AUTHORITY_APPROVED" = "true" ]; then
            ARGS+=(--authority-approved)
          fi
          npm run i18n:pr-gate -- "${ARGS[@]}"

      - name: Assert worktree clean after CI validation
        if: always() && steps.relevance.outputs.relevant == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "WORKTREE_DIRTY_AFTER_CI"
            git status --porcelain
            exit 1
          fi
          echo "WORKTREE_CLEAN_AFTER_CI=YES"
