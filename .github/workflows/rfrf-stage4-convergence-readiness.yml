name: RFRF Stage-4 convergence readiness

on:
  pull_request:
    paths:
      - 'backend/scripts/test/rfrf-*.sh'
      - 'backend/scripts/test/lib/rfrf-isolated-postgres-admin.sh'
      - 'backend/scripts/test/rfrf-stage4-convergence-readiness-ci-gate.sh'
      - 'backend/scripts/test/rfrf-f10-operational-tooling-gate.sh'
      - 'backend/scripts/ops/**'
      - '.github/workflows/rfrf-stage4-convergence-readiness.yml'
      - 'docs/audits/eed-rfrf-f10-6*.md'
      - 'backend/src/modules/vehicle-intelligence/energy-events/raw-refuel-candidate/raw-refuel-candidate-recovery*.ts'
      - 'backend/src/modules/vehicle-intelligence/energy-events/raw-refuel-candidate/raw-refuel-candidate-recovery*.spec.ts'
      - 'backend/prisma/migrations/*rfrf_f10_6_8_b*'
      - 'architecture/knowledge-graphs/energy-event-detection/**'

concurrency:
  group: rfrf-stage4-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rfrf-stage4-convergence-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RFRF_CI_POSTGRES_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start ephemeral PostgreSQL (registry mirror fallback)
        working-directory: backend
        env:
          CI_PG_USER: postgres
          CI_PG_PASSWORD: postgres
          CI_PG_DB: postgres
          CI_PG_PORT: 5432
        run: bash scripts/test/ci-start-postgres.sh

      - name: Install Redis (isolated test instance)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server postgresql-client
          redis-server --port 56379 --bind 127.0.0.1 --save "" --appendonly no --daemonize yes
          redis-cli -p 56379 ping

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: RFRF Stage-4 convergence readiness CI gate
        working-directory: backend
        run: bash scripts/test/rfrf-stage4-convergence-readiness-ci-gate.sh

      - name: F10 operational tooling gate (Stage-4 fixtures)
        working-directory: backend
        run: bash scripts/test/rfrf-f10-operational-tooling-gate.sh
