name: S4A PostgreSQL integration

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4a-foundation/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4b-orchestration/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4c-executor/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4d-replay/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4e-drift-watcher/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4f-observability/**'
      - 'backend/src/modules/dimo/provider-budget/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/position-acquisition/di-v0-position-snapshot-parse.ts'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/position-acquisition/di-v0-position-snapshot-semantic-validate.ts'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/r1-obd-acquisition/di-v0-r1-obd-snapshot-parse.ts'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/r1-obd-acquisition/di-v0-r1-obd-snapshot-semantic-validate.ts'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/shadow-persistence/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/trip-speed-quality/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4-research-worker/**'
      - 'backend/src/modules/vehicle-intelligence/driving-intelligence/s4-research/**'
      - 'backend/scripts/test/di-v0-s4a-*.sh'
      - 'backend/scripts/test/di-v0-s4-research-worker-postgres-ci.sh'
      - 'backend/scripts/test/ci-start-postgres.sh'
      - 'backend/scripts/test/di-v0-p2-trip-speed-quality-postgres-ci.sh'
      - 'backend/prisma/migrations/20261013180000_di_v0_trip_speed_quality_projection_v1/**'
      - 'backend/scripts/test/prisma-migrate-deploy-resilient.sh'
      - 'backend/prisma/migrations/20260927200000_di_v0_s4a_dormant_foundation/**'
      - 'backend/prisma/schema.prisma'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'architecture/drivingintelligence/design/s4a/**'
      - 'architecture/drivingintelligence/design/s4b/**'
      - 'architecture/drivingintelligence/design/s4c/**'
      - 'architecture/drivingintelligence/design/s4d/**'
      - 'architecture/drivingintelligence/scripts/validate-s4a-contract.sh'
      - '.github/workflows/s4a-postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  S4A_PG_USER: s4a_ci_test
  S4A_PG_PASSWORD: s4a_ci_test_local
  S4A_PG_DB: postgres
  DI_V0_S4A_PG_ADMIN_URL: postgresql://s4a_ci_test:s4a_ci_test_local@127.0.0.1:5432/postgres
  DI_V0_S4A_DB_PREFIX: synqdrive_s4a_ci

jobs:
  detect-s4a-changes:
    name: Detect S4 foundation-relevant changes
    runs-on: ubuntu-latest
    outputs:
      run_s4a: ${{ steps.detect.outputs.run_s4a }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect whether S4 foundation/runtime suites should run
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          is_s4_relevant_path() {
            local f="$1"
            case "$f" in
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4a-foundation/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4b-orchestration/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4c-executor/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4d-replay/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4e-drift-watcher/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4f-observability/*) return 0 ;;
              backend/src/modules/dimo/provider-budget/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/position-acquisition/di-v0-position-snapshot-parse.ts) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/position-acquisition/di-v0-position-snapshot-semantic-validate.ts) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/r1-obd-acquisition/di-v0-r1-obd-snapshot-parse.ts) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/r1-obd-acquisition/di-v0-r1-obd-snapshot-semantic-validate.ts) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/shadow-persistence/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/trip-speed-quality/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4-research-worker/*) return 0 ;;
              backend/src/modules/vehicle-intelligence/driving-intelligence/s4-research/*) return 0 ;;
              backend/scripts/test/di-v0-s4a-*) return 0 ;;
              backend/scripts/test/di-v0-p2-trip-speed-quality-postgres-ci.sh) return 0 ;;
              backend/scripts/test/di-v0-s4-research-worker-postgres-ci.sh) return 0 ;;
              backend/prisma/migrations/20261017183000_di_v0_s4_research_v1/*) return 0 ;;
              backend/prisma/migrations/20261017194500_di_v0_s4_research_outbox_intent_v2/*) return 0 ;;
              backend/prisma/migrations/20261017203000_di_v0_s4_research_runs_idempotency_fix/*) return 0 ;;
              backend/prisma/migrations/20261013180000_di_v0_trip_speed_quality_projection_v1/*) return 0 ;;
              backend/scripts/ops/di-v0-s4-historical-backlog-quarantine-production/*) return 0 ;;
              backend/scripts/ops/di-v0-s4-gate6-open-rekill-production/*) return 0 ;;
              backend/scripts/test/prisma-migrate-deploy-resilient.sh) return 0 ;;
              backend/prisma/migrations/20260927200000_di_v0_s4a_dormant_foundation/*) return 0 ;;
              backend/prisma/schema.prisma) return 0 ;;
              backend/package.json) return 0 ;;
              backend/package-lock.json) return 0 ;;
              architecture/drivingintelligence/design/s4a/*) return 0 ;;
              architecture/drivingintelligence/design/s4b/*) return 0 ;;
              architecture/drivingintelligence/design/s4c/*) return 0 ;;
              architecture/drivingintelligence/design/s4d/*) return 0 ;;
              architecture/drivingintelligence/scripts/validate-s4a-contract.sh) return 0 ;;
              .github/workflows/s4a-postgres-integration.yml) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            echo "S4_RELEVANT_CHANGE=true"
            echo "run_s4a=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Unsupported event for change detection: $EVENT_NAME" >&2
            exit 1
          fi

          if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
            echo "Missing pull_request base/head SHA" >&2
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
          relevant=false
          for path in "${changed[@]}"; do
            if is_s4_relevant_path "$path"; then
              relevant=true
              echo "S4-relevant path: $path"
            fi
          done

          if [[ "$relevant" == true ]]; then
            echo "S4_RELEVANT_CHANGE=true"
            echo "run_s4a=true" >> "$GITHUB_OUTPUT"
          else
            echo "S4_RELEVANT_CHANGE=false"
            echo "run_s4a=false" >> "$GITHUB_OUTPUT"
          fi

  # S4 unit Redis: ci-start-redis.sh (redis:7 image with ECR→gcr→Docker Hub fallbacks).
  # Host apt redis on ubuntu-latest can be 8.x — major=7 assertion must not use apt.
  s4-unit-tests:
    name: S4 unit test suites (S4A–S4F)
    runs-on: ubuntu-latest
    needs:
      - detect-s4a-changes
    if: needs.detect-s4a-changes.outputs.run_s4a == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Redis 7 (ci-start-redis.sh — pinned image, not host apt)
        run: |
          set -euo pipefail
          # ci-start-redis.sh: image pull, PONG via docker exec, major=7 assertion (no host redis-cli).
          bash backend/scripts/test/ci-start-redis.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies and generate Prisma client
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Run S4A–S4F unit suites
        working-directory: backend
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
          DIMO_PROVIDER_BUDGET_REDIS_INTEGRATION: '1'
        run: |
          set -euo pipefail
          npm run test:di:s4a
          npm run test:di:s4b
          npm run test:di:s4c
          npm run test:di:s4d
          npm run test:di:s4e
          npm run test:di:s4f
          npm run test:di:s4p9b:backlog-quarantine
          npm run test:di:s4p9b:gate6-reopen-contract
          npm run test:dimo:provider-budget
          npm run test:dimo:provider-budget:redis
          npm run test:di:s4-research-worker

  s4a-postgres-tests:
    name: S4 PostgreSQL test suites (S4A–S4F)
    runs-on: ubuntu-latest
    needs:
      - detect-s4a-changes
    if: needs.detect-s4a-changes.outputs.run_s4a == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: s4a-ci-postgres
          CI_PG_USER: ${{ env.S4A_PG_USER }}
          CI_PG_PASSWORD: ${{ env.S4A_PG_PASSWORD }}
          CI_PG_DB: ${{ env.S4A_PG_DB }}

      - name: Fail closed on non-ephemeral admin URL
        run: |
          set -euo pipefail
          case "$DI_V0_S4A_PG_ADMIN_URL" in
            *127.0.0.1*|*localhost*) ;;
            *) echo "DI_V0_S4A_PG_ADMIN_URL must target ephemeral CI PostgreSQL"; exit 1 ;;
          esac
          case "$DI_V0_S4A_PG_ADMIN_URL" in
            *srv1374778*|*app.synqdrive.eu*|*hstgr.cloud*|*mein-vps*)
              echo "DI_V0_S4A_PG_ADMIN_URL must not reference production"; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies and generate Prisma client
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Run S4A–S4F PostgreSQL suites
        working-directory: backend
        env:
          DI_V0_S4A_PG_ADMIN_URL: ${{ env.DI_V0_S4A_PG_ADMIN_URL }}
          DI_V0_S4A_DB_PREFIX: ${{ env.DI_V0_S4A_DB_PREFIX }}
          DI_V0_S4A_POSTGRES_INTEGRATION: '1'
          DI_V0_S4A_POSTGRES_REQUIRED: '1'
        run: |
          set -euo pipefail
          exports="$(bash scripts/test/di-v0-s4a-postgres-bootstrap.sh | grep '^export ')"
          eval "$exports"
          npm run test:di:s4a:postgres:ci
          npm run test:di:s4b:postgres
          npm run test:di:s4c:postgres
          npm run test:di:s4d:postgres
          npm run test:di:s4e:postgres
          npm run test:di:s4f:postgres
          npm run test:di:s4p9b:backlog-quarantine:postgres
          npm run test:di:trip-speed-quality:postgres:ci
          npm run test:di:s4-research-worker:postgres:ci

  s4a-postgres-integration:
    name: S4A PostgreSQL integration
    runs-on: ubuntu-latest
    needs:
      - detect-s4a-changes
      - s4-unit-tests
      - s4a-postgres-tests
    if: ${{ always() }}
    steps:
      - name: Required S4 foundation gate (fail closed)
        env:
          DETECT_RESULT: ${{ needs.detect-s4a-changes.result }}
          RUN_S4A: ${{ needs.detect-s4a-changes.outputs.run_s4a }}
          UNIT_RESULT: ${{ needs.s4-unit-tests.result }}
          TEST_RESULT: ${{ needs.s4a-postgres-tests.result }}
        run: |
          set -euo pipefail
          echo "detect-s4a-changes.result=${DETECT_RESULT}"
          echo "run_s4a=${RUN_S4A}"
          echo "s4-unit-tests.result=${UNIT_RESULT}"
          echo "s4a-postgres-tests.result=${TEST_RESULT}"

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Change detection did not succeed; required S4 gate FAIL" >&2
            exit 1
          fi

          if [[ "$RUN_S4A" == "true" ]]; then
            if [[ "$UNIT_RESULT" == "success" && "$TEST_RESULT" == "success" ]]; then
              echo "S4 unit + PostgreSQL suites passed; required gate satisfied."
              exit 0
            fi
            echo "S4-relevant changes require successful unit and PostgreSQL suites; unit=${UNIT_RESULT} postgres=${TEST_RESULT}" >&2
            exit 1
          fi

          if [[ "$RUN_S4A" == "false" ]]; then
            if [[ "$UNIT_RESULT" == "skipped" && "$TEST_RESULT" == "skipped" ]]; then
              echo "No S4-relevant changes; required S4 gate satisfied without running suites."
              exit 0
            fi
            echo "Expected unit and PostgreSQL suites to be skipped when run_s4a=false; unit=${UNIT_RESULT} postgres=${TEST_RESULT}" >&2
            exit 1
          fi

          echo "Unexpected run_s4a value: ${RUN_S4A}" >&2
          exit 1
