name: Battery V2 — HV-H3 CI

on:
  pull_request:
    paths:
      - 'backend/src/modules/vehicle-intelligence/battery-health/hv-h3/**'
      - 'backend/src/modules/vehicle-intelligence/battery-health/hv-h2/**'
      - 'architecture/battery-v2/scripts/validate-h3-longitudinal-trend-contracts.sh'
      - 'backend/scripts/test/battery-hv-h3-longitudinal-trend-postgres-ci.sh'
      - 'backend/scripts/test/ci-start-postgres.sh'
      - 'backend/scripts/ops/battery-hv-h3-trend-report.ts'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/battery-v2-hv-h3-ci.yml'
  workflow_dispatch:

concurrency:
  group: battery-v2-hv-h3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public

jobs:
  hv-h3-unit-and-contracts:
    name: HV-H3 unit + contract validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:battery:v2:hv-h3
        working-directory: backend
      - run: bash architecture/battery-v2/scripts/validate-h3-longitudinal-trend-contracts.sh
        working-directory: .

  hv-h3-postgres:
    name: HV-H3 longitudinal trend PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: battery-hv-h3-longitudinal-trend-ci-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Fail closed unless DATABASE_URL is localhost
        run: |
          set -euo pipefail
          case "${DATABASE_URL}" in
            *127.0.0.1*|*localhost*) ;;
            *)
              echo "DATABASE_URL must target localhost for HV-H3 postgres CI" >&2
              exit 1
              ;;
          esac
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm ci && npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:battery:v2:hv-h3:postgres:ci
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
