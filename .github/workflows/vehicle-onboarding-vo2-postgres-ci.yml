name: Vehicle Onboarding VO-2 PostgreSQL

on:
  pull_request:
    paths:
      - 'backend/prisma/schema.prisma'
      - 'backend/prisma/migrations/**'
      - 'backend/src/modules/vehicle-onboarding/**'
      - 'backend/scripts/test/vo2-*'
      - 'backend/scripts/test/ci-start-postgres.sh'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/vehicle-onboarding-vo2-postgres-ci.yml'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/vehicle-onboarding-*'

concurrency:
  group: vehicle-onboarding-vo2-postgres-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public

jobs:
  vo2-postgres:
    name: VO-2 persistence PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: vo2-ci-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Fail closed on non-ephemeral DATABASE_URL
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in
            *127.0.0.1*|*localhost*) ;;
            *)
              echo "DATABASE_URL must target ephemeral CI-local PostgreSQL"
              exit 1
              ;;
          esac
      - name: VO-2 / VO-2.1 PostgreSQL gates
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          bash scripts/test/vo2-vehicle-onboarding-postgres-ci.sh
