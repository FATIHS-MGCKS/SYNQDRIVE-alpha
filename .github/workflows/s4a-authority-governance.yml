name: S4A authority governance

on:
  pull_request:
    paths:
      - 'architecture/drivingintelligence/**'
      - 'architecture/dimo-integration/graph/**'
      - 'architecture/dimo-integration/scripts/validate-graph.sh'
      - 'architecture/scripts/validate-module-registry.sh'
      - '.github/workflows/s4a-authority-governance.yml'
  push:
    branches:
      - main
    paths:
      - 'architecture/drivingintelligence/**'
      - 'architecture/dimo-integration/graph/**'
      - 'architecture/dimo-integration/scripts/validate-graph.sh'
      - 'architecture/scripts/validate-module-registry.sh'
      - '.github/workflows/s4a-authority-governance.yml'

permissions:
  contents: read

jobs:
  s4a-authority-validators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies (js-yaml for graph validators)
        run: npm ci
        working-directory: backend

      - name: S4A machine contract + red-team suite
        run: bash architecture/drivingintelligence/scripts/validate-s4a-contract.sh

      - name: Driving Intelligence graph validator
        run: bash architecture/drivingintelligence/scripts/validate-graph.sh

      - name: Driving Intelligence docs validator
        run: bash architecture/drivingintelligence/scripts/validate-docs.sh

      - name: DIMO graph validator
        run: bash architecture/dimo-integration/scripts/validate-graph.sh

      - name: Central module registry validator
        run: bash architecture/scripts/validate-module-registry.sh
