name: Legal Documents — Production Readiness CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/testing/legal-documents-**'
      - 'docs/audits/legal-documents-**'
      - '.github/workflows/legal-documents-production-readiness.yml'
      - 'backend/scripts/test/synqdrive-nest-boot-check-ci.sh'
      - 'backend/scripts/test/ci-start-postgres.sh'
      - 'backend/scripts/test/ci-start-redis.sh'
      - 'scripts/audits/audit-dependencies.sh'
      - 'scripts/audits/compare-dependency-audit-baseline.js'
      - 'scripts/audits/dependency-lock-graph-identity.sh'
      - 'scripts/audits/validate-npm-audit-json.js'
      - 'scripts/audits/test-dependency-audit-baseline-regression.sh'
      - 'scripts/audits/test-dependency-audit-graph-identity.sh'
      - 'scripts/audits/fixtures/dependency-audit/**'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/legal-docs-*'

concurrency:
  group: legal-docs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  LEGAL_DOCUMENTS_POSTGRES_INTEGRATION: '1'
  JWT_SECRET: ci-synqdrive-nest-boot-check-jwt-secret-not-for-production

jobs:
  install-lockfile:
    name: Install (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend npm ci
        working-directory: backend
        run: npm ci
      - name: Frontend npm ci
        working-directory: frontend
        run: npm ci

  lint:
    name: Lint
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint:legal-documents
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint:legal-documents
        working-directory: frontend

  typecheck:
    name: Typecheck
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npx tsc --noEmit -p tsconfig.json
        working-directory: backend
      - run: npm ci && npx tsc -b
        working-directory: frontend

  prisma-validate:
    name: Prisma validate
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: bash scripts/test/verify-prisma-migration-timestamps.sh
        working-directory: backend
      - run: npm run prisma:validate
        working-directory: backend

  migration-tests:
    name: Migration tests (PostgreSQL)
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: legal-docs-migration-ci-postgres
          CI_PG_DB: postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - name: Run empty + legacy migration tests
        working-directory: backend
        run: bash scripts/test/legal-documents-migration-test.sh all

  backend-unit:
    name: Backend unit tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:legal-documents
        working-directory: backend

  backend-integration:
    name: Backend integration tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-redis.sh
        env:
          CI_REDIS_CONTAINER: legal-docs-ci-redis
      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: legal-docs-ci-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate && PRISMA_MIGRATE_EPHEMERAL_RECOVERY=1 bash scripts/test/prisma-migrate-deploy-resilient.sh
        working-directory: backend
        env:
          DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public
      - run: npm run test:legal-documents:integration && npm run test:legal-documents:security
        working-directory: backend
      - run: npm run test:dimo-provider-limiter:redis
        working-directory: backend
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
      - run: npm run test:legal-documents:postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive_ci_ephemeral?schema=public

  frontend-component:
    name: Frontend component tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:legal-documents
        working-directory: frontend

  playwright-e2e:
    name: Playwright E2E
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash ../backend/scripts/test/ci-playwright-install-chromium.sh
        working-directory: frontend
      - run: npm run test:legal-documents:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legal-documents-playwright-artifacts
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          retention-days: 14

  accessibility:
    name: Accessibility (axe)
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash ../backend/scripts/test/ci-playwright-install-chromium.sh
        working-directory: frontend
      - run: npm run test:legal-documents:a11y
        working-directory: frontend
        env:
          CI: 'true'

  production-build:
    name: Production build
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npx prisma generate && npm run build
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend

  nest-boot-check:
    name: Nest production boot check
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-postgres.sh
        env:
          CI_PG_CONTAINER: synqdrive-nest-boot-check-legal-postgres
      - name: Start Redis (ECR → GCR mirror → Docker Hub fallback)
        run: bash backend/scripts/test/ci-start-redis.sh
        env:
          CI_REDIS_CONTAINER: synqdrive-nest-boot-check-legal-redis
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - name: Fail closed on missing CI-local database config
        run: |
          set -euo pipefail
          case "${DATABASE_URL}" in
            *127.0.0.1*|*localhost*) ;;
            *)
              echo "DATABASE_URL must target ephemeral CI-local PostgreSQL"
              exit 1
              ;;
          esac
      - run: bash scripts/test/synqdrive-nest-boot-check-ci.sh
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

  security-scan:
    name: Security / dependency scan
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Baseline-aware dependency audit (baseline vs head)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: bash scripts/audits/audit-dependencies.sh

  ci-gate:
    name: CI gate (all critical jobs)
    runs-on: ubuntu-latest
    needs:
      - install-lockfile
      - lint
      - typecheck
      - prisma-validate
      - migration-tests
      - backend-unit
      - backend-integration
      - frontend-component
      - playwright-e2e
      - accessibility
      - production-build
      - nest-boot-check
      - security-scan
    steps:
      - run: echo "All critical legal-documents CI gates passed."
