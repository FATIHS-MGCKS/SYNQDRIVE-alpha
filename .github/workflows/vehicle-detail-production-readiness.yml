name: Vehicle Detail — Production Readiness CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/audits/vehicle-detail-**'
      - 'docs/testing/vehicle-detail-**'
      - '.github/workflows/vehicle-detail-production-readiness.yml'
  push:
    branches:
      - main
      - 'cursor/vehicle-detail-*'

concurrency:
  group: vehicle-detail-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  install-lockfile:
    name: Install (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend

  lint:
    name: Lint
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint:vehicle-detail
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint:vehicle-detail
        working-directory: frontend

  typecheck:
    name: Typecheck
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npx tsc --noEmit -p tsconfig.json
        working-directory: backend
      - run: npm ci && npx tsc -b
        working-directory: frontend

  backend-unit:
    name: Backend unit tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:vehicle-detail:verify:unit
        working-directory: backend

  backend-security:
    name: Backend security tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:vehicle-detail:security
        working-directory: backend

  backend-boundary-postgres:
    name: Backend boundary repair PostgreSQL tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synqdrive
          POSTGRES_PASSWORD: synqdrive
          POSTGRES_DB: synqdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synqdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate && PRISMA_MIGRATE_EPHEMERAL_RECOVERY=1 bash scripts/test/prisma-migrate-deploy-resilient.sh && npx prisma db push --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive?schema=public
      - run: npm run test:boundary-repair:postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive?schema=public
          BOUNDARY_REPAIR_POSTGRES_INTEGRATION: '1'

  frontend-component:
    name: Frontend component tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:vehicle-detail:unit
        working-directory: frontend

  playwright-e2e:
    name: Playwright E2E (Vehicle Detail)
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:vehicle-detail:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vehicle-detail-playwright-artifacts
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          retention-days: 14

  accessibility:
    name: Accessibility (axe)
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:vehicle-detail:a11y
        working-directory: frontend
        env:
          CI: 'true'

  production-build:
    name: Production build
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npx prisma generate && npm run build
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend

  security-scan:
    name: Security / dependency scan
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=critical
        working-directory: backend
        continue-on-error: true
      - run: npm audit --audit-level=critical
        working-directory: frontend
        continue-on-error: true
      - run: echo "Dependency audit completed (critical-only; see logs for advisories)"

  ci-gate:
    name: CI gate (all critical jobs)
    runs-on: ubuntu-latest
    needs:
      - install-lockfile
      - lint
      - typecheck
      - backend-unit
      - backend-security
      - backend-boundary-postgres
      - frontend-component
      - playwright-e2e
      - accessibility
      - production-build
      - security-scan
    steps:
      - run: echo "All critical vehicle-detail CI gates passed."
