name: Trip FSM — Production Readiness CI

on:
  pull_request:
    paths:
      - 'backend/src/modules/vehicle-intelligence/trips/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'architecture/trip-detection-lifecycle/**'
      - '.github/workflows/trip-fsm-production-readiness.yml'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/trip-fsm-*'
      - 'trip-fsm/**'

concurrency:
  group: trip-fsm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://synqdrive:synqdrive@127.0.0.1:5432/synqdrive?schema=public

jobs:
  install-lockfile:
    name: Install (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend

  backend-r10-unit:
    name: Backend R10 unit tests
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: >-
          npm test --
          --testPathPattern="trip-fsm-motor-off-pause-r10|trip-end-cycle-reset|trip-end-validation-r5|trip-terminal-resting-recovery-r7"
          --no-coverage
        working-directory: backend

  backend-trip-finalize-postgres:
    name: Backend trip finalize PostgreSQL integration
    needs: install-lockfile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synqdrive
          POSTGRES_PASSWORD: synqdrive
          POSTGRES_DB: synqdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synqdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Fail closed on missing CI-local database config
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required for trip finalize postgres integration"
            exit 1
          fi
          case "$DATABASE_URL" in
            *127.0.0.1*|*localhost*) ;;
            *)
              echo "DATABASE_URL must target ephemeral CI-local PostgreSQL (127.0.0.1 or localhost)"
              exit 1
              ;;
          esac
      - run: npm ci && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:trip-finalize:postgres:ci
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRIP_FINALIZE_POSTGRES_INTEGRATION: '1'
          TRIP_FINALIZE_POSTGRES_REQUIRED: '1'

  backend-r11-unit:
    name: Backend R11 unit + scaling probe
    needs: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate
        working-directory: backend
      - run: npm run test:trip-r11:unit
        working-directory: backend

  backend-trip-r11-postgres-redis:
    name: Backend R11 postgres+redis integration
    needs: install-lockfile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synqdrive
          POSTGRES_PASSWORD: synqdrive
          POSTGRES_DB: synqdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synqdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:trip-r11:postgres-redis:ci
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRIP_R11_POSTGRES_REDIS_INTEGRATION: '1'
          TRIP_R11_POSTGRES_REDIS_REQUIRED: '1'

  ci-gate:
    name: CI gate (Trip FSM critical jobs)
    runs-on: ubuntu-latest
    needs:
      - install-lockfile
      - backend-r10-unit
      - backend-r11-unit
      - backend-trip-finalize-postgres
      - backend-trip-r11-postgres-redis
    steps:
      - run: echo "Trip FSM CI gates passed (R10/R11 unit + postgres/redis integration)."
