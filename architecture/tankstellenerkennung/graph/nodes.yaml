  - id: FST-SCORE-V1-001
    type: score
    title: V1 candidate scoring function
    epistemic_status: CONFIRMED
    summary: >
      Inside geometry 100; geometry distance tiers 70/60/45/25; point tiers 55/35;
      metadata bonus 8/4. See fuel-station-location.constants.ts.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-scorer.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-location.constants.ts

  - id: FST-DEDUPE-V1-001
    type: dedupe
    title: Conservative candidate deduplication
    epistemic_status: CONFIRMED
    summary: Merges same-brand/same-station proximity duplicates before match decision.
    source_paths:
