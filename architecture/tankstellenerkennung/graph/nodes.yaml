# Tankstellenerkennung Knowledge Graph — Nodes (bootstrap V1)
# Validate: bash architecture/tankstellenerkennung/scripts/validate-graph.sh

nodes:
  # --- Domain ---
  - id: FST-DOM-TANKSTELLENERKENNUNG-001
    type: domain
    title: Tankstellenerkennung domain boundary
    epistemic_status: CONFIRMED
    summary: >
      Identifies fuel stations for persisted REFUEL VehicleEnergyEvents only.
      Does not decide whether refueling happened. Begins after Energy Event persistence.
    source_paths:
      - architecture/tankstellenerkennung/README.md
    evidence:
      - FST-EVID-CODE-BOUNDARY-001

  # --- Upstream event (dependency, not owned) ---
  - id: FST-EVT-REFUEL-PERSISTED-001
    type: event
    title: Persisted REFUEL VehicleEnergyEvent
    epistemic_status: CONFIRMED
    summary: >
      Canonical input to enrichment. Carries detection confidence and start coordinates.
      Owned by Energy Event subsystem.
    source_paths:
      - backend/prisma/schema.prisma
      - backend/src/modules/vehicle-intelligence/energy-events/energy-events.service.ts

  - id: FST-CONF-DETECTION-001
    type: confidence
    title: REFUEL detection confidence
    epistemic_status: CONFIRMED
    summary: VehicleEnergyEvent.confidence — confidence that refueling happened, not station identity.
    source_paths:
      - backend/prisma/schema.prisma
      - backend/src/modules/vehicle-intelligence/energy-events/energy-events.types.ts

  - id: FST-CONF-MATCH-001
    type: confidence
    title: Station match confidence
    epistemic_status: CONFIRMED
    summary: matchConfidence on enrichment row — HIGH/MEDIUM/LOW for MATCHED resolver outcomes only.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-decision.ts

  - id: FST-AUTH-TRUST-001
    type: authority
    title: Trusted station assignment policy
    epistemic_status: CONFIRMED
    summary: trusted=true only for MATCHED + HIGH or MEDIUM matchConfidence. Separate from detection confidence.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-trust.policy.ts

  # --- OSM data ---
  - id: FST-DATA-OSM-001
    type: data
    title: OSM fuel_stations reference dataset
    epistemic_status: CONFIRMED
    summary: >
      Local PostGIS table osm.fuel_stations with dataset_version metadata.
      Live calibration/production version geofabrik-germany-20260830, 18195 stations.
    source_paths:
      - backend/scripts/ops/osm-fuel-stations/schema.sql
      - architecture/OSM_FUEL_STATIONS_DATASET_2026-08-30.md
    evidence:
      - FST-EVID-ARCH-OSM-001
      - FST-EVID-CALIBRATION-001

  - id: FST-IDX-POSTGIS-001
    type: index
    title: PostGIS GiST indexes on fuel_stations
    epistemic_status: CONFIRMED
    summary: centroid/geom GiST indexes support ST_DWithin and KNN ordering.
    source_paths:
      - backend/scripts/ops/osm-fuel-stations/build_staging_indexes.sql

  # --- Resolver pipeline ---
  - id: FST-RES-V1-001
    type: resolver
    title: FuelStationLocationResolver V1
    epistemic_status: CONFIRMED
    summary: >
      fuel-station-resolver-v1. Primary 100m query; 250m fallback only if primary returns zero candidates.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-location-resolver.service.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-location.constants.ts
    evidence:
      - FST-EVID-CODE-RESOLVER-001

  - id: FST-QUERY-ST-DWITH-001
    type: query
    title: ST_DWithin bounded candidate filter
    epistemic_status: CONFIRMED
    summary: Filters osm.fuel_stations by centroid geography within search radius.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-candidate.repository.ts

  - id: FST-QUERY-KNN-001
    type: query
    title: KNN ordering centroid <-> point
    epistemic_status: CONFIRMED
    summary: ORDER BY centroid <-> query_geog LIMIT 10 for deterministic nearest-first retrieval.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-candidate.repository.ts

  - id: FST-SCORE-V1-001
    type: score
    title: V1 candidate scoring function
    epistemic_status: CONFIRMED
    summary: >
      Inside geometry 100; geometry distance tiers 70/60/45/25; point tiers 55/35;
      metadata bonus 8/4. See fuel-station-location.constants.ts.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-scorer.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-location.constants.ts

  - id: FST-DEDUPE-V1-001
    type: dedupe
    title: Conservative candidate deduplication
    epistemic_status: CONFIRMED
    summary: Merges same-brand/same-station proximity duplicates before match decision.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-dedupe.ts

  - id: FST-AMB-DECISION-001
    type: ambiguity
    title: Ambiguity decision rules
    epistemic_status: CONFIRMED
    summary: >
      AMBIGUOUS when top candidates too close in score (<20 gap), geometry (<15m with conditions),
      or relative gap <15% below HIGH threshold.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-decision.ts

  - id: FST-CONF-THRESHOLDS-001
    type: confidence
    title: Match confidence thresholds
    epistemic_status: CONFIRMED
    summary: HIGH >=85 + inside/<=15m geometry; MEDIUM >=70; LOW >=55; NOT_FOUND <=54.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-decision.ts

  # --- Enrichment orchestration ---
  - id: FST-PIPE-POST-PERSIST-001
    type: pipeline
    title: Post-persist enrichment producer hook
    epistemic_status: CONFIRMED
    summary: EnergyEventsService calls enqueueAfterPersistFromEvent after REFUEL upsert/create.
    source_paths:
      - backend/src/modules/vehicle-intelligence/energy-events/energy-events.service.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-producer.service.ts

  - id: FST-POL-CUTOVER-STARTTIME-001
    type: policy
    title: startTime cutover authority
    epistemic_status: CONFIRMED
    summary: Eligibility uses VehicleEnergyEvent.startTime >= FUEL_STATION_ENRICHMENT_CUTOVER_AT, not createdAt.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-cutover.util.ts
    evidence:
      - FST-DEC-STARTTIME-CUTOVER-001

  - id: FST-POL-NO-BACKFILL-001
    type: policy
    title: No historical automatic backfill
    epistemic_status: CONFIRMED
    summary: Pre-cutover REFUEL events are never automatically enriched by deploy or recovery.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-producer.service.ts
    evidence:
      - FST-DEC-NO-BACKFILL-001
      - FST-EVID-PROD-DEPLOY-001

  - id: FST-QUEUE-ENRICH-001
    type: queue
    title: BullMQ energy.refuel.station.enrich
    epistemic_status: CONFIRMED
    summary: Async queue for refuel station enrichment jobs; idempotent job keys via fingerprint.
    source_paths:
