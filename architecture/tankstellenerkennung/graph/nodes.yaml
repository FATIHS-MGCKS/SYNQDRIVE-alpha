    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-orchestrator.service.ts

  - id: FST-AUTH-COORD-START-001
    type: authority
    title: Canonical enrichment coordinate authority
    epistemic_status: CONFIRMED
    summary: >
