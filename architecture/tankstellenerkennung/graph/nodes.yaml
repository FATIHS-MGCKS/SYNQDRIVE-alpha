      V1 does not use end coordinates or route inference.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-coordinate.util.ts

  - id: FST-AUTH-FINGERPRINT-001
    type: authority
    title: Input fingerprint authority
    epistemic_status: CONFIRMED
    summary: >
      SHA-256 over energyEventId + rounded lat/lon + resolverVersion.
      Governs idempotency keys and terminal skip matching.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-fingerprint.util.ts

  - id: FST-AUTH-RECOVERY-LEADER-001
    type: authority
    title: Recovery scheduler cluster leader authority
    epistemic_status: CONFIRMED
    summary: >
      fuel_station_enrichment_recovery is classified SINGLETON_GLOBAL in the scheduler registry.
      recoverMissedEnrichments() calls SchedulerLeaderGuardService.shouldRun() so only the
      elected cluster scheduler leader executes the recovery sweep tick when leader election is
      enabled and functioning. SCHEDULER_LEADER_ELECTION_ENABLED=true is the operational safety
      precondition for multi-replica singleton execution. When leader election is disabled,
      every replica intentionally behaves as leader and duplicate recovery sweeps are possible.
      Applies to the recovery scheduler tick only — RefuelStationEnrichmentProcessor (BullMQ worker)
      remains independently multi-replica capable and is NOT governed by this singleton invariant.
    source_paths:
      - backend/src/workers/schedulers/fuel-station-enrichment-recovery.scheduler.ts
      - backend/src/shared/scheduler-leader/scheduler-leader-guard.service.ts
      - backend/src/shared/scheduler-leader/scheduler-leader-election.service.ts
      - backend/src/shared/scheduler-leader/scheduler-leader-election.config.ts
      - backend/src/shared/scheduler-leader/scheduler-leader.registry.ts

  - id: FST-STATE-PROCESSING-001
    type: state
    title: processingStatus state machine
    epistemic_status: CONFIRMED
    summary: PENDING → PROCESSING → COMPLETED | FAILED. DB-authoritative for automatic paths.
    source_paths:
      - backend/prisma/schema.prisma
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-orchestrator.service.ts

  - id: FST-STATE-RESOLUTION-001
    type: state
    title: resolutionStatus state machine
    epistemic_status: CONFIRMED
    summary: >
      Runtime enum: MATCHED | AMBIGUOUS | NOT_FOUND | NO_COORDINATES | INVALID_COORDINATES | ERROR.
      NO_COORDINATES set by orchestrator when canonical coordinate missing.
      INVALID_COORDINATES mapped from resolver. ERROR is retryable; other terminal resolutions
      block automatic re-resolution when fingerprint matches.
    source_paths:
      - backend/prisma/schema.prisma
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-orchestrator.service.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-trust.policy.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-lifecycle.policy.ts

  - id: FST-POL-LIFECYCLE-SKIP-001
    type: policy
    title: Automatic lifecycle skip and terminal policy
    epistemic_status: CONFIRMED
    summary: >
      FAILED + same fingerprint + resolverVersion → terminal_failed (automatic paths).
      COMPLETED + same fingerprint + resolverVersion + non-retryable resolution → terminal_completed.
      COMPLETED + resolutionStatus=ERROR → retry permitted. COMPLETED + resolutionStatus=null → retry permitted.
      Changed fingerprint or resolverVersion → re-resolution may be permitted.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-lifecycle.policy.ts

  - id: FST-POL-RECOVERY-ELIGIBILITY-001
    type: policy
    title: Recovery eligibility policy
    epistemic_status: CONFIRMED
    summary: >
      Recovery sweeps post-cutover REFUEL with missing/stale PENDING|PROCESSING enrichment only.
      Pre-cutover never swept. FAILED terminal rows never auto-requeued.
    source_paths:
      - backend/src/workers/schedulers/fuel-station-enrichment-recovery.scheduler.ts

  - id: FST-POL-FEATURE-ENABLE-001
    type: policy
    title: Feature and cutover enablement authority
    epistemic_status: CONFIRMED
    summary: >
