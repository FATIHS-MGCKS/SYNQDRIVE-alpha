      - backend/src/workers/processors/refuel-station-enrichment.processor.ts

  - id: FST-WORK-PROCESSOR-001
    type: worker
    title: RefuelStationEnrichmentProcessor
    epistemic_status: CONFIRMED
    summary: Worker invokes FuelStationEnrichmentOrchestrator for each job.
    source_paths:
      - backend/src/workers/processors/refuel-station-enrichment.processor.ts
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-orchestrator.service.ts

  - id: FST-REC-SCHEDULER-001
    type: recovery
    title: Fuel station enrichment recovery scheduler
    epistemic_status: CONFIRMED
    summary: Periodic recovery re-enqueues eligible non-terminal enrichment rows; respects FAILED terminality.
    source_paths:
      - backend/src/workers/schedulers/fuel-station-enrichment-recovery.scheduler.ts

  - id: FST-STATE-LIFECYCLE-001
    type: state
    title: DB-authoritative enrichment lifecycle
    epistemic_status: CONFIRMED
    summary: >
      vehicle_energy_event_fuel_station_enrichments processingStatus/resolutionStatus govern automatic
      skip/retry; BullMQ history is not business source of truth.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-lifecycle.policy.ts
    evidence:
      - FST-DEC-DB-LIFECYCLE-001

  - id: FST-PERSIST-ENRICHMENT-001
    type: persist
    title: VehicleEnergyEventFuelStationEnrichment persistence
    epistemic_status: CONFIRMED
    summary: One enrichment row per energy event; stores resolver provenance and station fields.
    source_paths:
      - backend/prisma/schema.prisma
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-orchestrator.service.ts

  - id: FST-POL-TRUST-HIGH-MEDIUM-001
    type: policy
    title: Trusted = MATCHED HIGH/MEDIUM only
    epistemic_status: CONFIRMED
    summary: LOW matches are diagnostic; not authoritative in API trusted flag or UI trusted mode.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/enrichment/fuel-station-enrichment-trust.policy.ts
    evidence:
      - FST-DEC-TRUST-HIGH-MEDIUM-001

