  - id: FST-AMB-DECISION-001
    type: ambiguity
    title: Ambiguity decision rules
    epistemic_status: CONFIRMED
    summary: >
      AMBIGUOUS when top candidates too close in score (<20 gap), geometry (<15m with conditions),
      or relative gap <15% below HIGH threshold.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-decision.ts

  - id: FST-CONF-THRESHOLDS-001
    type: confidence
    title: Match confidence thresholds
    epistemic_status: CONFIRMED
    summary: HIGH >=85 + inside/<=15m geometry; MEDIUM >=70; LOW >=55; NOT_FOUND <=54.
    source_paths:
      - backend/src/modules/vehicle-intelligence/fuel-stations/fuel-station-match-decision.ts

