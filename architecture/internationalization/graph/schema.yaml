# Internationalization (i18n) Knowledge Graph — Schema

version: "1.0"
description: >
  Schema for Internationalization living architecture authority.
  Maintained incrementally by agents per AGENT_CONTRACT.md.

node_types:
  - domain
  - data
  - pipeline
  - orchestrator
  - resolver
  - state
  - policy
  - authority
  - api
  - dto
  - consumer
  - decision
  - evidence
  - test_evidence
  - hypothesis
  - invariant
  - gap
  - contradiction
  - failed_approach
  - rejected_approach
  - superseded_approach

