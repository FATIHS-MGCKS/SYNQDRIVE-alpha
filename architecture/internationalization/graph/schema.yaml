  - consumed_by
  - upstream_of
  - downstream_of
  - decides
  - invokes
  - uses
  - input_to
  - returns_to
  - governs
  - projects_to
  - presents
  - supports
  - contradicts
  - supersedes
  - superseded_by
  - tested_by
  - protected_by
  - does_not_solve
  - gates
  - validates
  - derives_from
  - enables

relation_semantics_doc: architecture/internationalization/AGENT_CONTRACT.md

id_prefixes:
