  - id: TDL-DEC-R9A-001
    type: decision
    title: Durable-first wake mailboxes
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: Replace destructive consume with atomic pending/successor persistence and logical wake origin.
    source_paths:
      - docs/audits/trip-fsm/R9_ADAPTIVE_POLLING_WAKE_IMPLEMENTATION_2026-09-07.md
    evidence:
      - TDL-EVID-R9-AUDIT-001

  - id: TDL-DEC-R9B-001
    type: decision
    title: Handoff rearm without self-coalescing stable jobId
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: BullMQ handoff uses DelayedError/moveToDelayed; same stable jobId must not self-coalesce successor dispatch.
    source_paths:
      - docs/audits/trip-fsm/R9_ADAPTIVE_POLLING_WAKE_IMPLEMENTATION_2026-09-07.md
    evidence:
      - TDL-EVID-R9-AUDIT-001

  - id: TDL-DEC-R9C-001
    type: decision
    title: Generation-1 probe terminal bound
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: Max one generation-1 wake probe; gen-1 never schedules gen-2 successor or UNKNOWN retry handoff.
    source_paths:
      - docs/audits/trip-fsm/R9_ADAPTIVE_POLLING_WAKE_IMPLEMENTATION_2026-09-07.md
    evidence:
      - TDL-TEST-R9-001

  - id: TDL-DEC-R9D-001
    type: decision
    title: Continuation RESTING + eligibility authority
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: Successor scheduling requires ELIGIBLE_RESTING; Redis READ_ERROR distinct from MISSING.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-continuation.util.ts
    evidence:
      - TDL-EVID-R9-AUDIT-001

  - id: TDL-DEC-R9E-001
    type: decision
    title: UNKNOWN handoff defer and obsolete CAS retirement
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: UNKNOWN defers via SnapshotWakeHandoffDeferError; exact-version bounded retirement without unbounded recursion.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-coordinator.service.ts
    evidence:
      - TDL-TEST-R9-001

  - id: TDL-DEC-R9F-001
    type: decision
    title: UNKNOWN bounded retry outside handoff dispatch
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: All UNKNOWN continuation surfaces schedule bounded retry handoff with explicit enqueue outcomes.
    source_paths:
