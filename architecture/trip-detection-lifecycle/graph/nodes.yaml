# Trip Detection & Lifecycle — Knowledge Graph Nodes (Phase 4 partial, post-R9)
# Validate: bash architecture/trip-detection-lifecycle/scripts/validate-graph.sh

nodes:
  - id: TDL-DOM-TRIP-LIFECYCLE-001
    type: domain
    title: Trip Detection & Lifecycle domain
    epistemic_status: CONFIRMED
    summary: >
      Owns live trip FSM, start/end detection, tracking queue, boundary persistence,
      recovery/reconciliation, route artifacts. Does not own post-trip DI scoring or DIMO provider gateway.
    source_paths:
      - architecture/trip-detection-lifecycle/README.md
    evidence:
      - TDL-EVID-CODE-OWNERSHIP-001

  - id: TDL-AUTH-LIFECYCLE-001
    type: authority
    title: TripDecisionEngine lifecycle authority
    epistemic_status: CONFIRMED
    summary: Sole writer of vehicleTrip.tripStatus and terminal lifecycle commits.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/decision/trip-decision.engine.ts
      - backend/src/modules/vehicle-intelligence/trips/TRIP_OWNERSHIP.ts
    evidence:
      - TDL-EVID-CODE-OWNERSHIP-001

  - id: TDL-AUTH-FSM-PERSIST-001
    type: authority
    title: TripDetectionOrchestrationService persisted FSM authority
    epistemic_status: CONFIRMED
    summary: Owns VehicleTripDetectionState transitions and orchestration entry points.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-detection-orchestration.service.ts

  - id: TDL-ORCH-TRIP-DETECTION-001
    type: orchestrator
    title: TripDetectionOrchestrationService
    epistemic_status: CONFIRMED
    summary: Canonical trip lifecycle orchestration from snapshot and tracking triggers.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-detection-orchestration.service.ts

  - id: TDL-PIPE-WAKE-INTAKE-001
    type: pipeline
    title: SnapshotWakeIntakeService
    epistemic_status: CONFIRMED
    summary: >
      DIMO provider trigger ingress (speed/ignition) → durable Redis pending mailbox →
      canonical snapshot job request. Does not fetch DIMO directly on handoff path.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-intake.service.ts

  - id: TDL-ORCH-WAKE-COORD-001
    type: orchestrator
    title: SnapshotWakeCoordinatorService
    epistemic_status: CONFIRMED
    summary: >
      R9 wake coordinator: pending/successor mailboxes, coalesce semantics, continuation
      authority, bounded UNKNOWN retry, post-terminal handoff dispatch.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-coordinator.service.ts
    evidence:
      - TDL-EVID-R9-AUDIT-001
      - TDL-TEST-R9-001

  - id: TDL-WORK-SNAPSHOT-001
    type: worker
    title: DimoSnapshotProcessor
    epistemic_status: CONFIRMED
    summary: Canonical serialized snapshot fetch per vehicle; invokes afterSnapshotJob wake hooks.
    source_paths:
      - backend/src/workers/processors/dimo-snapshot.processor.ts

  - id: TDL-WORK-HANDOFF-001
    type: worker
    title: SnapshotWakeHandoffProcessor
    epistemic_status: CONFIRMED
    summary: Lightweight BullMQ handoff worker; never provider-fetches; dispatches canonical snapshot path.
    source_paths:
      - backend/src/workers/processors/snapshot-wake-handoff.processor.ts

  - id: TDL-QUEUE-SNAPSHOT-POLL-001
    type: queue
    title: dimo.snapshot.poll
    epistemic_status: CONFIRMED
    summary: Stable canonical snapshot job per vehicle (same jobId serialization).
    source_paths:
      - backend/src/workers/queues/queue-names.ts

  - id: TDL-QUEUE-WAKE-HANDOFF-001
    type: queue
    title: snapshot-wake-handoff
    epistemic_status: CONFIRMED
    summary: Post-terminal successor / UNKNOWN retry handoff queue with DelayedError rearm.
    source_paths:
      - backend/src/workers/queues/queue-names.ts

  - id: TDL-PERSIST-PENDING-MAILBOX-001
    type: persist
    title: Redis pending wake mailbox
    epistemic_status: CONFIRMED
    summary: Atomic merge, monotonic providerObservedAt, versioned CAS ACK.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-redis.scripts.ts

  - id: TDL-PERSIST-SUCCESSOR-MAILBOX-001
    type: persist
    title: Redis successor handoff mailbox
    epistemic_status: CONFIRMED
    summary: Versioned successor record with notBeforeMs and exact-version retirement.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-redis.scripts.ts

  - id: TDL-AUTH-CONTINUATION-001
    type: authority
    title: Wake continuation classifier
    epistemic_status: CONFIRMED
    summary: ELIGIBLE_RESTING requires FSM RESTING + vehicle eligible; UNKNOWN on read errors; fail-closed.
    source_paths:
      - backend/src/workers/snapshot-wake/snapshot-wake-continuation.util.ts

  - id: TDL-EVID-CODE-OWNERSHIP-001
    type: evidence
    title: P1 trip ownership invariants
    source_type: CURRENT_CODE
    epistemic_status: CONFIRMED
    summary: TripDecisionEngine sole lifecycle writer; detectors read-only.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/TRIP_OWNERSHIP.ts

