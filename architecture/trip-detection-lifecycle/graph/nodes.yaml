  - id: TDL-DEC-R9-001
    type: decision
    title: R9 adaptive polling wake subsystem
    decision_status: VALIDATED
    epistemic_status: CONFIRMED
    summary: Start-liveness ingress around canonical snapshot path; not a second lifecycle authority.
    source_paths:
      - docs/audits/trip-fsm/R9_ADAPTIVE_POLLING_WAKE_IMPLEMENTATION_2026-09-07.md
