      fetchEventDataSummary returns [] on error, so a provider failure is indistinguishable from zero
      events. Recorded cross-module by DI (EXP-021 C1D.10A, DI-GAP-S4-NATIVE-READINESS-001); no DIMO code
      change. Closure (strict failure propagation + per-trip attestation) belongs to a separately
      authorized native-ingest slice.
