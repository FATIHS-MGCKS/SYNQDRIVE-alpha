      Public telemetry GraphQL introspection + DIMO VSS 4.2 spec — speed/rpm/obdThrottlePosition/obdEngineLoad/
      powertrainCombustionEngineECT/powertrainTransmissionCurrentGear/isIgnitionOn are nullable Float with
      FloatAggregation (AVG, MED, MAX, MIN, RAND, FIRST, LAST); gear is a signed int8 index and ignition a
      boolean, both unsafe under AVG. Consumed by the dormant DI S3B R1 adapter (query V0_3).
    source_paths:
