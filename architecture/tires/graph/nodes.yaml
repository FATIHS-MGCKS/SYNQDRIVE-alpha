  # --- Decisions ---
  - id: TIRE-DEC-PRESERVE-EXISTING-STACK-001
    type: decision
    title: Preserve existing tire management, lifecycle, ledger, API, UI and safety mechanisms
    epistemic_status: CONFIRMED
    decision_status: PROPOSED
    summary: >
      Owner decision 2026-10-24. No runtime change in this PR; all current production behaviour retained.
    evidence:
