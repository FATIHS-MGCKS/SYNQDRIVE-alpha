  - id: TIRE-DEC-V2-FROZEN-TO-BE-SUPERSEDED-001
    type: decision
    title: Tire Wear Model V2 is obsolete as future calculation basis but remains unchanged until controlled replacement
    epistemic_status: CONFIRMED
    decision_status: PROPOSED
    summary: >
      V2 formula, config and snapshots stay productive and frozen; a successor is introduced only via a
      shadow comparison that is validated against ground truth. V2 is not marked SUPERSEDED in this PR.
    evidence:
      - TIRE-EVID-CODE-WEAR-MODEL-V2-001

  - id: TIRE-DEC-DS4-FUTURE-LOAD-BASIS-SHADOW-ONLY-001
    type: decision
    title: DS4 Motion Events are the future driving-load basis — shadow only, no productive influence
    epistemic_status: CONFIRMED
    decision_status: PROPOSED
    summary: >
      Any DS4-derived tire input is computed and stored as shadow and must not influence tire status, alerts,
      snapshots used by the API, or the rental gate. No new wear formula in this PR.
    evidence:
      - TIRE-EVID-PROD-DS4-SHADOW-RUNS-2026-10-24-001
      - TIRE-EVID-DS4-FABLE-REVIEW-2026-10-24-001

  - id: TIRE-DEC-DS4-CONSERVATIVE-ADMISSION-POLICY-001
    type: decision
    title: Conservative DS4 event admission policy for tire inputs (proposed, not implemented)
    epistemic_status: INFERRED
    decision_status: PROPOSED
    summary: >
      OK → admissible; DEGRADED → admissible for counts/durations only, intensity UNRATED; LIMITED → excluded
      from intensity, counted separately for coverage reporting; ARTEFACT_SUSPECT → excluded entirely.
      Intensity only from Δv/duration mean, never peak1s. Trips with speedAuthority mix or missing payload →
      neutral fallback (no load contribution, coverage flag).
    evidence:
      - TIRE-EVID-DS4-FABLE-REVIEW-2026-10-24-001
      - TIRE-EVID-CODE-DS4-EVENT-TYPES-001

  - id: TIRE-DEC-DS4-ASYNC-RETRY-CONSUMER-001
    type: decision
    title: DS4 → tire shadow via async retryable consumer, not synchronous with trip finalization
    epistemic_status: CONFIRMED
    decision_status: PROPOSED
    summary: >
      Enqueue tire shadow work when ledger row exists; processor retries until readForTrip succeeds or policy
      limit; bind rows to diV0MotionCoreShadowRunId + combinedInputIdentity + shadowBundleVersion + adapterVersion.
    evidence:
      - TIRE-EVID-CODE-DS4-PERSISTED-EVENT-ROW-001

  - id: TIRE-DEC-NO-DOUBLE-COUNTING-001
    type: decision
    title: One acceleration/braking evidence source per factor — no double counting
    epistemic_status: INFERRED
    decision_status: PROPOSED
    summary: >
      A future model must not combine DI HF-derived stress scores/harsh counters and DS4 motion events in the
      same factor. Shadow comparison reports both sources side by side with explicit source versioning.
    evidence:
      - TIRE-EVID-CODE-DI-IMPACT-FOR-TIRE-001
      - TIRE-EVID-CODE-DS4-EVENT-TYPES-001

