      - BAT-V2-EVID-CODE-REST-SYNTHETIC-MEASUREMENT-PERSISTENCE-001
      - BAT-V2-EVID-CODE-REST-TARGET-METADATA-RMW-001
      - BAT-V2-EVID-CODE-RECONCILE-NO-CANONICAL-REST-001
      - BAT-V2-EVID-CODE-ASSESSMENT-POLICY-SKIP-001
      - BAT-V2-EVID-CODE-JOB-PRODUCER-INFLIGHT-DEDUPE-001
    non_effects:
      - Does not implement assessment enqueue or reconciliation scan changes
      - Does not close BAT-V2-GAP-LV-CANONICAL-ASSESSMENT-HANDOFF-001
      - Does not resolve configuration invariant (D3)
      - Does not guarantee exactly-once execution
      - No migration, flags, backfill, or production mutation

  - id: BAT-V2-DEC-LV-SINGLE-AUTHORITY-CUTOVER-001
    type: decision
    title: Battery V2 single-authority cutover and configuration invariant (D3)
    epistemic_status: CONFIRMED
    decision_status: VALIDATED
    summary: >
      Target architecture: canonical V2 REST + assessment handoff + assessment mandatory core; legacy REST and
