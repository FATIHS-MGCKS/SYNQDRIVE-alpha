# Battery V2 Knowledge Graph — Nodes (bootstrap seed)
# Validate: bash architecture/battery-v2/scripts/validate-graph.sh

nodes:
  # --- Authorities ---
  - id: BAT-V2-AUTH-TRIP-END-001
    type: authority
    title: Trip end time anchor authority
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: >
      When tripEndAt is present, LV REST anchor = authoritative trip.endTime.
      Session idempotency derives from vehicleId + anchor ms.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window.state-machine.ts
    evidence:
      - BAT-V2-EVID-CODE-ANCHOR-001
      - BAT-V2-EVID-ARCH-PIPELINE-CLOSURE-001

  - id: BAT-V2-AUTH-LV-OPEN-001
    type: authority
    title: ICE LV rest-window opening evidence precedence
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: >
      isEngineOffForRestWindowOpening — ignition-off + measured stationary speed
      can outrank engine_load proxy at opening gate.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window.policy.ts
    evidence:
      - BAT-V2-EVID-PR-1393-001
      - BAT-V2-EVID-PROD-61715ECD-001

  - id: BAT-V2-AUTH-LV-MEASURE-001
    type: authority
    title: Conservative REST measurement engine-off quality
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: >
      isEngineOffForRest — downstream evaluation remains conservative;
      residual engine_load may reject in-window observations.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window.policy.ts
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/battery-rest-target-evaluation.ts
    evidence:
      - BAT-V2-EVID-PR-1393-001

  - id: BAT-V2-AUTH-REST-EVAL-001
    type: authority
    title: REST target canonical evaluation authority
    epistemic_status: CONFIRMED
    summary: BatteryRestTargetEvaluationService adjudicates VALID/MISSED/retryable; handler persists metadata only.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/handlers/battery-rest-target-evaluate.handler.ts
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/battery-rest-target-evaluation.ts

  # --- Policies ---
  - id: BAT-V2-POL-NO-FABRICATE-001
    type: policy
    title: No fabricated REST measurements
    epistemic_status: CONFIRMED
    summary: Missing telemetry evidence yields MISSED or PENDING_EVALUATION — not numeric zero.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/handlers/battery-rest-target-evaluate.handler.ts

  - id: BAT-V2-POL-OPEN-VS-MEASURE-001
    type: policy
    title: Opening vs measurement policy split
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: Opening gate and measurement quality use different engine-off functions intentionally.
    evidence:
      - BAT-V2-DEC-1393-001

  # --- Jobs ---
  - id: BAT-V2-JOB-LV-SESSION-OPEN-001
    type: job
    title: BATTERY_LV_REST_SESSION_OPEN
    epistemic_status: CONFIRMED
    summary: Durable session-open job; idempotency lv-rest-open:{vehicleId}:{anchorMs}.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-lv-rest-session.producer.ts

  - id: BAT-V2-JOB-REST-EVAL-001
    type: job
    title: BATTERY_REST_TARGET_EVALUATE
    epistemic_status: CONFIRMED
    summary: Evaluates REST_60M/REST_6H; requires restWindowId on payload.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-rest-target.producer.ts
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/handlers/battery-rest-target-evaluate.handler.ts
    evidence:
      - BAT-V2-EVID-ARCH-REST-CONTRACT-001

  # --- Liveness rules ---
  - id: BAT-V2-LIVE-SESSION-RECON-001
    type: liveness_rule
    title: LV session reconciliation arming
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: reconcileMissingLvRestSessions calls ensureLvRestWindowForFinalizedTrip before recovery enqueue.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-reconciliation.service.ts

  - id: BAT-V2-LIVE-PEND-EVAL-001
    type: liveness_rule
    title: PENDING_EVALUATION reconciliation deferral
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: Retryable missing evidence → PENDING_EVALUATION + return; reconciliation reschedules on cadence.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/handlers/battery-rest-target-evaluate.handler.ts
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window-target.metadata.ts
    evidence:
      - BAT-V2-EVID-TEST-PEND-EVAL-001

  - id: BAT-V2-LIVE-ORPHAN-ENQ-001
    type: liveness_rule
    title: Orphaned ENQUEUED REST target recovery
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: ENQUEUED without live Bull job and without DLQ → PENDING_EVALUATION → recovery schedule.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-reconciliation.service.ts
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-job-producer.service.ts
    evidence:
      - BAT-V2-EVID-TEST-ORPHAN-ENQ-001
    non_effects:
      - Does not cover RUNNING-without-job orphan state

  # --- States ---
  - id: BAT-V2-STATE-REST-TARGET-001
    type: state
    title: REST target metadata status FSM
    epistemic_status: CONFIRMED
    summary: SCHEDULED|ENQUEUED|RUNNING|PENDING_EVALUATION|terminal statuses in session metadata.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window-target.metadata.ts

  # --- Signals ---
  - id: BAT-V2-SIG-LV-VOLTAGE-001
    type: signal
    title: LV battery voltage (LIVE_VOLTAGE)
    epistemic_status: CONFIRMED
    summary: Primary REST measurement observation source in shadow pipeline.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/battery-rest-target-evaluation.ts

  # --- Decisions ---
  - id: BAT-V2-DEC-1383-001
    type: decision
    title: Observation-independent LV Rest session opening
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: Trip finalization enqueues durable session-open; reconciliation scans COMPLETED trips.
    evidence:
      - BAT-V2-EVID-PR-1383-001
      - BAT-V2-EVID-ARCH-LIVENESS-001
    non_effects:
      - Does not alone fix REST ENQUEUED/DLQ liveness
      - Does not fix ICE opening load-proxy (#1393)

  - id: BAT-V2-DEC-1393-001
    type: decision
    title: ICE rest-window opening policy hardening
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: Split opening vs measurement engine-off policies for ICE key-off shapes.
    evidence:
      - BAT-V2-EVID-PR-1393-001
      - BAT-V2-EVID-PROD-61715ECD-001
    notes: Refines pre-#1393 opening proxy behavior

  - id: BAT-V2-DEC-1445-001
    type: decision
    title: Stage 1 pipeline defect closure
    epistemic_status: CONFIRMED
    decision_status: PRODUCTION_VALIDATED
    summary: Liveness, trip binding, REST temporal defects A-D; orphan ENQUEUED recovery; no historical backfill.
    evidence:
      - BAT-V2-EVID-PR-1445-001
      - BAT-V2-EVID-ARCH-PIPELINE-CLOSURE-001
    non_effects:
      - RUNNING orphan recovery
      - Stage 2 / publication / readiness activation
      - Historical backfill
      - Proof all natural post-fix trips succeed

  # --- Gaps ---
  - id: BAT-V2-GAP-RUNNING-ORPHAN-001
    type: gap
    title: Orphaned RUNNING REST target without Bull job
    epistemic_status: CONFIRMED
    summary: RUNNING treated as already-scheduled; no hasLiveJob recovery analogous to ENQUEUED.
    open_questions:
      - Intended recovery path after handler crash mid-flight?
    evidence:
      - BAT-V2-EVID-ARCH-PIPELINE-CLOSURE-001

  - id: BAT-V2-GAP-SKIPPED-REST-001
    type: gap
    title: SKIPPED REST target semantics
    epistemic_status: UNKNOWN
    summary: Status exists in metadata enum; full lifecycle not reconstructed in bootstrap.

  - id: BAT-V2-GAP-BRIDGE-FALLBACK-001
    type: gap
    title: Bridge trip resolution without authoritative finalized trip
    epistemic_status: INFERRED
    summary: lastActivityAt anchor and ±120s fallback documented; edge cases not fully traced in bootstrap.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-rest-window/lv-rest-window-ingestion-bridge.service.ts

  - id: BAT-V2-GAP-HV-AUTHORITY-001
    type: gap
    title: HV/PHEV authority model
    epistemic_status: UNKNOWN
    summary: Not reconstructed in bootstrap.

  - id: BAT-V2-GAP-CONSUMER-READ-001
    type: gap
    title: Consumer read-model authority
    epistemic_status: UNKNOWN
    summary: Which UI/API surfaces use canonical vs legacy battery data — not mapped.

  # --- Failed approaches ---
  - id: BAT-V2-FAIL-OBS-ONLY-OPEN-001
    type: failed_approach
    title: Observation-only session opening
    epistemic_status: HISTORICAL
    summary: Insufficient — session existence depended on post-finalize observation cycle.
    evidence:
