  # --- Contradictions ---
  - id: BAT-V2-CONTRA-LV-TIMESTAMP-PROVENANCE-001
    type: contradiction
    title: LV providerTimestamp fallback vs REST evidence eligibility
    epistemic_status: CONTRADICTED
    summary: >
      Doctrine: provider/fetch receipt time is not automatically a new provider observation.
      Code: persistFromObservationClassify sets observedAt = lvBatteryObservedAt ?? receivedAt
      (receivedAt = providerFetchedAt ?? now) and persists providerTimestamp from observedAt.
      buildRestTargetContext uses separate observedAt fallback (lvBatteryObservedAt ?? now).
      KNOWN: fallback implementation exists. UNKNOWN: production reachability and whether
      fallback-created rows enter REST evaluation. Resolution: UNRESOLVED.
    source_paths:
      - backend/src/modules/vehicle-intelligence/battery-health/lv-live-voltage/lv-live-voltage-ingestion.service.ts
    open_questions:
