  - id: BAT-V2-DEC-PH4-LV-PUB-CHAIN-001
    type: decision
    title: LV canonical handoff architecture (Phase 4 PROPOSED)
    epistemic_status: INFERRED
    decision_status: PROPOSED
    summary: >
      Hybrid direct enqueue + reconciliation safety net for canonical REST → assessment → publication.
      Assessment: buildAssessmentJobIdempotencyKey (assess: prefix); PKG-01 IMPLEMENTATION_READY (D1/D2/D3).
      Publication: BATTERY_PUBLICATION_UPDATE after deterministic assessment-selection authority (D4 SPEC REQUIRED);
      policy in BatteryPublicationService only; buildPublicationJobIdempotencyKey; PKG-02 blockers —
      assessment-track selection D4 SPEC REQUIRED; publicationVersion D5 SPEC REQUIRED.
      Multi-track recompute (WORKSHOP_OVERRIDE + TELEMETRY) requires track authority — not "publish every assessment".
      Configuration invariant closed BAT-V2-DEC-LV-SINGLE-AUTHORITY-CUTOVER-001 (D3): single-authority target; REST_SHADOW
      and legacy are temporary migration scaffolds; BATTERY_V2_LV_HANDOFF_ENABLED NOT INTRODUCED; PUBLICATION retained
      as effect gate. P0_ACTIVATION_BLOCKER not active outage. NOT implemented; NOT VALIDATED; three LV gaps remain open.
    source_paths:
      - architecture/battery-v2/resolution/lv-publication-chain-resolution.md
    non_effects:
      - Does not enable readiness or Stage 3
      - Does not fix timestamp provenance
      - Does not resolve open gaps until runtime merged

  - id: BAT-V2-DEC-LV-ASSESSMENT-INPUT-VERSION-001
    type: decision
    title: Canonical LV REST assessment inputVersion (D1)
    epistemic_status: CONFIRMED
    decision_status: VALIDATED
    summary: >
      PKG-01 inputVersion = persisted BatteryMeasurement.id for canonical REST → assessment handoff.
      Job identity: assess:{vehicleId}:LV_HEALTH:{measurementId} via buildAssessmentJobIdempotencyKey.
      inputVersion is trigger authority for the persisted measurement, not model version, timestamp provenance,
      trip, or rest-window identity. Identity/retry-in-flight-dedupe safe — not durable exactly-once execution.
      Rejected: observedAt, trip/session/window alone, composite rest binding.
      Legacy snapshot path may keep capture.capturedAt.getTime() — no re-keying. NOT PRODUCTION_VALIDATED.
    source_paths:
      - architecture/battery-v2/decisions/lv-assessment-input-version-decision.md
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-job-idempotency.policy.ts
