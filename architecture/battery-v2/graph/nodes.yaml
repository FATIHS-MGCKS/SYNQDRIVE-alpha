      - Does not close BAT-V2-GAP-LV-CANONICAL-ASSESSMENT-HANDOFF-001
      - Does not resolve configuration invariant (D3)
      - Crash-boundary spec closed by BAT-V2-DEC-LV-ASSESSMENT-CRASH-BOUNDARY-001 (D2)
      - No migration, flags, backfill, or production mutation

  - id: BAT-V2-DEC-LV-ASSESSMENT-CRASH-BOUNDARY-001
    type: decision
    title: Canonical LV REST assessment crash-boundary recovery (D2)
    epistemic_status: CONFIRMED
    decision_status: VALIDATED
    summary: >
      Hybrid C+ crash recovery for canonical REST to assessment handoff: direct normal path, direct retry repair
      for handoff-eligible measurements only (provenance.sourceObservationId — not any-measurement bool), periodic
      reconciliation safety net, durable target-scoped handoff state in LV REST session/target metadata (not
      BatteryMeasurement). Same D1 identity (measurement.id); canonical correlation sourceEntityId=measurement.id.
      Monotonic MISSING<ENQUEUED<EXECUTED; late ENQUEUED no-op when EXECUTED; concurrency-safe target merge required.
      Terminal synthetic missed/unsupported measurements preserve MISSED/FAILED — no handoff. Distinguish handoff
      liveness from policy outcome. At-least-once — not exactly-once. NOT PRODUCTION_VALIDATED.
    source_paths:
      - architecture/battery-v2/decisions/lv-assessment-crash-boundary-decision.md
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/handlers/battery-rest-target-evaluate.handler.ts
      - backend/src/modules/vehicle-intelligence/battery-health/jobs/battery-v2-reconciliation.service.ts
    evidence:
