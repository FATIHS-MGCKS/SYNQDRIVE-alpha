scope:
  owns:
    - Trip behavior enrichment orchestration after finalization
    - Post-finalize enqueue and sync enrichment lifecycle
    - Hardware-path routing (SMART5 HF vs LTE_R1 native)
    - Route/safety enrichment stage within ATE pipeline
    - Misuse aggregation trigger within ATE pipeline
    - Driving-impact job enqueue (not scoring semantics)
