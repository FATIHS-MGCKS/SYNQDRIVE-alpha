    - Scheduler leader + reconciliation mutex usage for ATE liveness
    - UI/manual fallback paths for enrichment backlog recovery
  does_not_own:
    - REFUEL / RECHARGE / energy-event semantics → KG-EED
    - Driving Intelligence V2 scoring models → KG-Driving-Intelligence
    - DIMO provider budget algorithm internals → KG-Scaling-Process
    - Battery V2 HV charge session lifecycle → Battery V2 KG
    - Trip FSM boundary detection authority → TripDecisionEngine (referenced)

