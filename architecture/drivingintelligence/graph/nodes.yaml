# Driving Intelligence Knowledge Graph — Nodes (bootstrap V1)
# Validate: bash architecture/drivingintelligence/scripts/validate-graph.sh

nodes:
  # --- Domain ---
  - id: DI-DOM-DRIVING-INTELLIGENCE-001
    type: domain
    title: Driving Intelligence domain boundary
    epistemic_status: CONFIRMED
    summary: >
      Post-trip behavioral analysis, operational load scoring, event persistence,
      V2 orchestration, and API projection. Does not own trip boundaries or energy events.
    source_paths:
      - architecture/drivingintelligence/README.md
    evidence:
      - DI-EVID-CODE-BOUNDARY-001

  # --- External ---
  - id: DI-EXT-DIMO-001
    type: external_provider
    title: DIMO telemetry and segments API
    epistemic_status: CONFIRMED
    summary: Source for segments (trip boundaries), HF signals, native behavior events, snapshots.
    source_paths:
      - backend/src/modules/dimo/dimo-segments.service.ts

  # --- Trip boundary (adjacent) ---
  - id: DI-TRIP-SEGMENTS-001
    type: trip_boundary
    title: DIMO Segments canonical trip boundaries
    epistemic_status: CONFIRMED
    summary: VehicleTrip rows anchored on DIMO segment start/end. DI consumes COMPLETED trips only.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-detection-orchestration.service.ts

  - id: DI-ADJ-TRIP-FSM-001
    type: adjacent_system
    title: Trip detection FSM
    epistemic_status: CONFIRMED
    summary: Live trip tracking; finalizes trips and triggers enrichment producers. Not owned by DI.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-detection-orchestration.service.ts

  - id: DI-ADJ-ATE-001
    type: adjacent_system
    title: Automatic Trip Enrichment
    epistemic_status: CONFIRMED
    summary: Parallel trip enrichment concerns; boundary documented in ATE knowledge graph.
    source_paths:
      - architecture/knowledge-graphs/automatic-trip-enrichment/README.md

  - id: DI-ADJ-EED-001
    type: adjacent_system
    title: Energy Event Detection
    epistemic_status: CONFIRMED
    summary: REFUEL/RECHARGE detection; timeline adjacent only.
    source_paths:
      - architecture/knowledge-graphs/discovery/ENERGY_EVENT_DETECTION_DISCOVERY_2026-09-01.md

  - id: DI-ADJ-BRAKE-HEALTH-001
    type: adjacent_system
    title: Brake health V2
    epistemic_status: CONFIRMED
    summary: Consumes brakingLoad and thermal proxies from DI impact publish stage.
    source_paths:
      - backend/src/modules/vehicle-intelligence/brakes/

  - id: DI-ADJ-TIRE-HEALTH-001
    type: adjacent_system
    title: Tire health V2
    epistemic_status: CONFIRMED
    summary: Consumes tireLoad proxy from DI impact publish stage.
    source_paths:
      - backend/src/modules/vehicle-intelligence/tires/

  # --- Signals ---
  - id: DI-SIG-HF-001
    type: signal
    title: DIMO high-frequency signals
    epistemic_status: CONFIRMED
    summary: >
      Queried with interval 1s. RD003 HF median ~2.00s new physical samples;
      RD002 sealed aggregate-bucket Δt P50 13.489s — separate metrics.
      Speed, RPM, throttle, coolant, longitudinal accel, etc.
    source_paths:
      - backend/src/modules/dimo/dimo-segments.service.ts
      - docs/audits/dimo-lte-r1-reference-drive-002-c63-signal-differential-2026-09-02.md
    evidence:
      - DI-EVID-RD003-CADENCE-001
      - DI-EVID-RD002-SEALED-CADENCE-001

  - id: DI-SIG-NATIVE-001
    type: signal
    title: DIMO native behavior events
    epistemic_status: CONFIRMED
    summary: LTE_R1 provider-classified behavior.* events; primary short-event authority for LTE_R1.
    source_paths:
      - backend/src/modules/vehicle-intelligence/dimo-native-driving-events/

