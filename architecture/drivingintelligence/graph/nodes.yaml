  - id: DI-SVC-ENRICH-ORCH-001
    type: service
    title: TripEnrichmentOrchestratorService
    epistemic_status: CONFIRMED
    summary: Canonical legacy post-trip chain; enqueues behavior enrichment then impact compute.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-enrichment-orchestrator.service.ts

  - id: DI-QUEUE-BEHAVIOR-001
    type: queue
    title: trip.behavior.enrichment
    epistemic_status: CONFIRMED
    summary: BullMQ queue for post-trip HF behavior enrichment.
    source_paths:
      - backend/src/workers/queues/queue-names.ts

  - id: DI-WORK-BEHAVIOR-001
    type: worker
    title: TripBehaviorEnrichmentProcessor
    epistemic_status: CONFIRMED
    summary: Worker invoking TripBehaviorEnrichmentService per trip.
    source_paths:
      - backend/src/workers/processors/trip-behavior-enrichment.processor.ts

  - id: DI-SVC-BEHAVIOR-ENRICH-001
    type: service
    title: TripBehaviorEnrichmentService
    epistemic_status: CONFIRMED
    summary: >
      Whole-trip HF pass: fetchHighFrequency, preprocess, accel/brake/abuse detectors,
      TripBehaviorEvent persistence. Trip Signal Summary for LTE_R1 (sparse HF).
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/trip-behavior-enrichment.service.ts

  - id: DI-ACQ-HF-POST-TRIP-001
    type: acquisition
    title: Post-trip fetchHighFrequency
    epistemic_status: CONFIRMED
    summary: Single whole-trip DIMO HF query per enrichment run. No recovery overlap in production.
    source_paths:
      - backend/src/modules/dimo/dimo-segments.service.ts
      - backend/src/modules/vehicle-intelligence/trips/trip-behavior-enrichment.service.ts

  - id: DI-ALGO-HF-ACCEL-001
    type: algorithm
    title: HF acceleration detector
    epistemic_status: CONFIRMED
    summary: Point-pair delta-v/delta-t harsh acceleration classification.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/hf-acceleration.ts

  - id: DI-ALGO-HF-BRAKE-001
    type: algorithm
    title: HF braking detector
    epistemic_status: CONFIRMED
    summary: Point-pair deceleration classification including EXTREME >= 7.0 m/s².
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/hf-braking.ts

  - id: DI-ALGO-HF-ABUSE-001
    type: algorithm
    title: HF abuse detector
    epistemic_status: CONFIRMED
    summary: >
      Whole-trip abuse episodes: kickdown, launch-like, full braking >= 7.5 m/s²,
      possible impact >= 12.0 m/s², cold engine, long idle, etc.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/hf-abuse.ts

  - id: DI-QUEUE-IMPACT-001
    type: queue
    title: trip.driving-impact.compute
    epistemic_status: CONFIRMED
    summary: Legacy impact compute queue; also used by V2 DRIVING_IMPACT_COMPUTE handler path.
    source_paths:
      - backend/src/workers/queues/queue-names.ts

  - id: DI-WORK-IMPACT-001
    type: worker
    title: DrivingImpactProcessor
    epistemic_status: CONFIRMED
    summary: Legacy worker calling DrivingImpactService.computeForTrip.
    source_paths:
      - backend/src/workers/processors/driving-impact.processor.ts

  - id: DI-SVC-IMPACT-001
    type: service
    title: DrivingImpactService
    epistemic_status: CONFIRMED
    summary: Per-trip stress scoring, load components, rolling aggregate. Model v1.2.0.
    source_paths:
      - backend/src/modules/vehicle-intelligence/driving-impact/driving-impact.service.ts

  - id: DI-ALGO-IMPACT-SCORER-001
    type: algorithm
    title: DrivingImpactScorer
    epistemic_status: CONFIRMED
    summary: Pure functions capLinear normalization; longitudinal, braking, stop-go, thermal, composite.
    source_paths:
      - backend/src/modules/vehicle-intelligence/driving-impact/driving-impact-scorer.ts

  - id: DI-MET-STRESS-001
    type: derived_metric
    title: drivingStressScore
    epistemic_status: CONFIRMED
    summary: Composite vehicle operational load 0-100. NOT driver quality.
    source_paths:
      - backend/src/modules/vehicle-intelligence/driving-impact/driving-impact-scorer.ts

  - id: DI-MET-TIRE-LOAD-001
    type: derived_metric
    title: tireLoad proxy
    epistemic_status: CONFIRMED
    summary: >
      Operational load proxy 0.35*braking + 0.35*stopGo + 0.30*longitudinal.
      NOT measured tread wear.
    source_paths:
      - backend/src/modules/vehicle-intelligence/driving-impact/driving-impact-load-components.ts

  - id: DI-MET-BRAKE-LOAD-001
    type: derived_metric
    title: brakingLoad proxy
    epistemic_status: CONFIRMED
    summary: Derived from brakingStressScore and provenance. NOT measured pad wear.
    source_paths:
      - backend/src/modules/vehicle-intelligence/driving-impact/driving-impact-load-components.ts

  - id: DI-SVC-DRIVER-SCORE-001
    type: service
    title: DriverScoreService
    epistemic_status: CONFIRMED
    summary: >
      Distance-weighted aggregation of drivingStressScore per subject.
      Misnamed — aggregates vehicle stress not driver quality.
    source_paths:
      - backend/src/modules/vehicle-intelligence/trips/driver-score.service.ts

