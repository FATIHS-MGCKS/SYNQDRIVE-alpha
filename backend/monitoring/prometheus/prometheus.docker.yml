# SynqDrive Prometheus — local docker-compose (monitoring profile)
#
# Targets:
#   - backend via host-gateway (PM2 or npm run start:dev on host)
#   - node_exporter, blackbox_exporter (compose services)
#   - alertmanager on 127.0.0.1:9093

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: synqdrive-local
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts-infra.yml

scrape_configs:
  - job_name: synqdrive-backend
    metrics_path: /api/v1/metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'backend:3000'
    bearer_token_file: /etc/prometheus/secrets/metrics_bearer_token

  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: blackbox-ssl
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets:
          - 'https://app.synqdrive.eu'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
